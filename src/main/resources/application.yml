spring:
  application:
    name: gameshelf

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gameshelf}
    username: ${DB_USER:gameshelf}
    password: ${DB_PASSWORD:gameshelf}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080